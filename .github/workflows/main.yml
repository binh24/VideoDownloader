name: Build APK with Buildozer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt update
        sudo apt install -y \
          git wget curl unzip swig libltdl-dev libffi-dev \
          build-essential ccache libncurses5:i386 libstdc++6:i386 libgtk2.0-0:i386 \
          openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.34

    # === THÊM BƯỚC CACHE ĐỂ TIẾT KIỆM THỜI GIAN Ở CÁC LẦN BUILD SAU ===
    - name: Cache Buildozer global directory
      uses: actions/cache@v3
      with:
        path: |
          .buildozer
          /home/runner/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Accept Android SDK Licenses Automatically
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        mkdir -p .buildozer

    - name: Build APK with Buildozer
      run: |
        yes | buildozer android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
